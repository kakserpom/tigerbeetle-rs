[package]
name = "tigerbeetle-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tigerbeetle-core = { path = "../tigerbeetle-core" }

[[bin]]
name = "tigerbeetle"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
# Tests must observe the same `CONFIG` (test_min) that upstream tests use; see the
# `test-min` feature docs in tigerbeetle-core.
tigerbeetle-core = { path = "../tigerbeetle-core", features = ["test-min"] }
